name: Build, Scan, Push and Deploy

on:
  push:
    branches:
      - main
      - ci-test

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-app
  EC2_INSTANCE_ID: i-0bc24fa175310699e
  SECRET_NAME: devops/rds

jobs:

  oidc-debug:
    name: OIDC Debug
    runs-on: ubuntu-latest

    steps:
      - name: Debug OIDC claims
        uses: github/actions-oidc-debugger@main

  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::402372753653:role/github-actions-devops-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


  deploy-staging:
    name: Deploy to Staging
    needs: build-scan-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::402372753653:role/github-actions-devops-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy application using SSM
        env:
          IMAGE_URI: 402372753653.dkr.ecr.ap-south-1.amazonaws.com/devops-app:${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"SECRET=\$(aws secretsmanager get-secret-value --secret-id $SECRET_NAME --region $AWS_REGION --query SecretString --output text)\",
              \"DB_HOST=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"host\\\"])')\",
              \"DB_USER=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"username\\\"])')\",
              \"DB_PASSWORD=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"password\\\"])')\",
              \"DB_NAME=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"dbname\\\"])')\",
              \"sudo docker pull $IMAGE_URI\",
              \"sudo docker stop devops-app || true\",
              \"sudo docker rm devops-app || true\",
              \"sudo docker run -d --name devops-app -p 8080:8080 -e DB_HOST=\\\"\$DB_HOST\\\" -e DB_USER=\\\"\$DB_USER\\\" -e DB_PASSWORD=\\\"\$DB_PASSWORD\\\" -e DB_NAME=\\\"\$DB_NAME\\\" -e PORT=8080 $IMAGE_URI\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out"
          exit 1


  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::402372753653:role/github-actions-devops-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy approved version to production
        env:
          IMAGE_URI: 402372753653.dkr.ecr.ap-south-1.amazonaws.com/devops-app:${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"SECRET=\$(aws secretsmanager get-secret-value --secret-id $SECRET_NAME --region $AWS_REGION --query SecretString --output text)\",
              \"DB_HOST=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"host\\\"])')\",
              \"DB_USER=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"username\\\"])')\",
              \"DB_PASSWORD=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"password\\\"])')\",
              \"DB_NAME=\$(echo \\\"\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"dbname\\\"])')\",
              \"sudo docker pull $IMAGE_URI\",
              \"sudo docker stop devops-app || true\",
              \"sudo docker rm devops-app || true\",
              \"sudo docker run -d --name devops-app -p 8080:8080 -e DB_HOST=\\\"\$DB_HOST\\\" -e DB_USER=\\\"\$DB_USER\\\" -e DB_PASSWORD=\\\"\$DB_PASSWORD\\\" -e DB_NAME=\\\"\$DB_NAME\\\" -e PORT=8080 $IMAGE_URI\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "Production SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Production deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              exit 1
            fi

            sleep 10
          done

          echo "Production deployment timed out"
          exit 1
